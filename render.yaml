services:
  - type: web
    name: attentionhq
    runtime: python
    plan: starter
    buildCommand: pip install -e . && npm ci --prefix acp --omit=dev
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DEVIN_API_KEY
        sync: false
      - key: DEVIN_ORG_ID
        sync: false
      - key: DEVIN_ACP_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22.23.2"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-5.6-luna:nitro
      - key: BOARD_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REPOS
        value: jackyliang/answer-hq,jackyliang/answerhq-web,jackyliang/attentionhq
