[project]
name = "attentionhq"
version = "0.1.0"
description = "Linear-style Kanban for Devin sessions and GitHub issues"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
]

[tool.setuptools]
py-modules = ["server"]
